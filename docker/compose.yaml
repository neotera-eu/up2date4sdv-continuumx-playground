# ContinuumX playground stack (Podman Compose).
#
# Things you may want to change:
# - ports below (SSH, demo UI, MQTT, CloudCore, Kubernetes API)
# - image tags (continuumx-playground-*:1.23)
# - restart policy
#
# Volumes keep state after the system is up (cluster, edge config, images).
# Do not use "make prune" if you want to keep that state.

name: continuumx-playground

services:
  mqtt-broker:
    image: docker.io/library/eclipse-mosquitto:2
    hostname: mqtt-broker
    restart: unless-stopped
    networks:
      - cxnet
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  cloud:
    build:
      context: ..
      dockerfile: docker/cloud/Dockerfile
    image: continuumx-playground-cloud:1.23
    hostname: u2deb-cloud
    privileged: true
    cgroup: private
    restart: unless-stopped
    pids_limit: -1
    security_opt:
      - label=disable
      - seccomp=unconfined
    devices:
      - /dev/kmsg:/dev/kmsg
    networks:
      - cxnet
    ports:
      - "6443:6443"
      - "9443:9443"
      - "30080:30080"
      - "10000:10000"
      - "10002:10002"
      - "2222:22"
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - cx-join:/var/cx-join
      - cx-cloud-containerd:/var/lib/containerd
      - cx-cloud-kubelet:/var/lib/kubelet
      - cx-cloud-etcd:/var/lib/etcd
      - cx-cloud-kubernetes:/etc/kubernetes
      - cx-cloud-playground:/var/lib/cx-playground
      - /lib/modules:/lib/modules:ro
    # ip_forward + bridge-nf are also set on the host by host-prep.sh
    # (required for rootless; in-container sysctls alone are not enough).
    sysctls:
      - net.ipv4.ip_forward=1
    healthcheck:
      test: ["CMD", "test", "-f", "/var/cx-join/cloud-ready"]
      interval: 20s
      timeout: 5s
      retries: 40
      start_period: 180s

  edge:
    build:
      context: ..
      dockerfile: docker/edge/Dockerfile
    image: continuumx-playground-edge:1.23
    hostname: u2deb-edge
    privileged: true
    cgroup: private
    restart: unless-stopped
    pids_limit: -1
    security_opt:
      - label=disable
      - seccomp=unconfined
    devices:
      - /dev/kmsg:/dev/kmsg
    networks:
      - cxnet
    ports:
      - "2223:22"
      - "3000:3000"
    depends_on:
      cloud:
        condition: service_started
      mqtt-broker:
        condition: service_started
      firmware-catalog:
        condition: service_healthy
    environment:
      FIRMWARE_CATALOG_URL: http://firmware-catalog:3100
      FIRMWARE_CATALOG_NAME: virtual-thermal-ecu
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - cx-join:/var/cx-join
      - cx-edge-containerd:/var/lib/containerd
      - cx-edge-kubeedge:/etc/kubeedge
      - /lib/modules:/lib/modules:ro
    sysctls:
      - net.ipv4.ip_forward=1
    healthcheck:
      test: ["CMD", "systemctl", "is-active", "--quiet", "edgecore"]
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 120s

  # Uses the same network as edge so ServiceBus can call 127.0.0.1:3000
  servicebus-demo:
    build: ./servicebus-demo
    image: continuumx-playground-servicebus-demo:1.23
    restart: unless-stopped
    network_mode: "service:edge"
    depends_on:
      - edge

  # Firmware catalog: seeds bin/ecu sim-1.0.0 + sim-1.1.0 for edge OTA download.
  firmware-catalog:
    build:
      context: ..
      dockerfile: docker/firmware-catalog/Dockerfile
    image: continuumx-playground-firmware-catalog:1.23
    hostname: firmware-catalog
    restart: unless-stopped
    networks:
      - cxnet
    ports:
      - "3100:3100"
    volumes:
      - cx-firmware-data:/data/firmwares
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

networks:
  cxnet:
    driver: bridge

volumes:
  cx-join:
  cx-cloud-containerd:
  cx-cloud-kubelet:
  cx-cloud-etcd:
  cx-cloud-kubernetes:
  cx-cloud-playground:
  cx-edge-containerd:
  cx-edge-kubeedge:
  cx-firmware-data:
