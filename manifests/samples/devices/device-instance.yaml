# Reference manifest for a fresh deployment. For an existing Device, use the patch helper
# to preserve its current desired values (for example targetCoolantTemperature=63.0).
# All collectCycle/reportCycle values are MILLISECONDS.
apiVersion: devices.kubeedge.io/v1beta1
kind: Device
metadata:
  name: automotive-thermal-ecu-001
  namespace: default
  labels:
    app: up2date4sdv-demo
    device-type: automotive-thermal-ecu
    vehicle-domain: thermal-management
  annotations:
    description: Simulated vehicle thermal-management peripheral ECU connected to
      the central ECU
    asset-id: THERM-ECU-001
    vehicle-subsystem: cooling
    network-interface: Simulated automotive Ethernet link; no physical peripheral
      is connected
spec:
  deviceModelRef:
    name: automotive-thermal-ecu
  nodeName: u2deb-edge
  protocol:
    protocolName: virtual-ethernet
    configData:
      deviceId: THERM-ECU-001
      simulator: true
      endpoint: virtual-ethernet://automotive-thermal-ecu-001
      updateIntervalSeconds: 10
      transport: simulated-ethernet
  stateReport:
    reportToCloud: true
    reportCycle: 60000
  properties:
  - name: coolantTemperature
    reportToCloud: true
    collectCycle: 10000
    reportCycle: 10000
    visitors:
      protocolName: virtual-ethernet
      configData:
        source: simulator
        signal: coolantTemperature
  - name: inverterTemperature
    reportToCloud: true
    collectCycle: 10000
    reportCycle: 10000
    visitors:
      protocolName: virtual-ethernet
      configData:
        source: simulator
        signal: inverterTemperature
  - name: motorTemperature
    reportToCloud: true
    collectCycle: 10000
    reportCycle: 10000
    visitors:
      protocolName: virtual-ethernet
      configData:
        source: simulator
        signal: motorTemperature
  - name: coolantPressure
    reportToCloud: true
    collectCycle: 10000
    reportCycle: 10000
    visitors:
      protocolName: virtual-ethernet
      configData:
        source: simulator
        signal: coolantPressure
  - name: pumpSpeed
    reportToCloud: true
    collectCycle: 10000
    reportCycle: 10000
    visitors:
      protocolName: virtual-ethernet
      configData:
        source: simulator
        signal: pumpSpeed
  - name: fanDutyCycle
    reportToCloud: true
    collectCycle: 10000
    reportCycle: 10000
    visitors:
      protocolName: virtual-ethernet
      configData:
        source: simulator
        signal: fanDutyCycle
  - name: supplyVoltage
    reportToCloud: true
    collectCycle: 20000
    reportCycle: 20000
    visitors:
      protocolName: virtual-ethernet
      configData:
        source: simulator
        signal: supplyVoltage
  - name: coolantLevel
    reportToCloud: true
    collectCycle: 20000
    reportCycle: 20000
    visitors:
      protocolName: virtual-ethernet
      configData:
        source: simulator
        signal: coolantLevel
  - name: faultActive
    reportToCloud: true
    collectCycle: 10000
    reportCycle: 10000
    visitors:
      protocolName: virtual-ethernet
      configData:
        source: simulator
        signal: faultActive
  - name: faultCode
    reportToCloud: true
    collectCycle: 10000
    reportCycle: 10000
    visitors:
      protocolName: virtual-ethernet
      configData:
        source: simulator
        signal: faultCode
  - name: firmwareVersion
    reportToCloud: true
    visitors:
      protocolName: virtual-ethernet
      configData:
        source: simulator
        signal: firmwareVersion
    collectCycle: 60000
    reportCycle: 60000
  - name: serialNumber
    reportToCloud: true
    visitors:
      protocolName: virtual-ethernet
      configData:
        source: simulator
        signal: serialNumber
    collectCycle: 60000
    reportCycle: 60000
  - name: operatingMode
    desired:
      value: AUTO
      metadata:
        source: cloud
        reason: initial-configuration
    reportToCloud: true
    visitors:
      protocolName: virtual-ethernet
      configData:
        source: simulator
        signal: operatingMode
    collectCycle: 30000
    reportCycle: 30000
  - name: samplingInterval
    desired:
      value: '10'
      metadata:
        source: cloud
        reason: initial-configuration
    reportToCloud: true
    visitors:
      protocolName: virtual-ethernet
      configData:
        source: simulator
        signal: samplingInterval
    collectCycle: 30000
    reportCycle: 30000
  - name: targetCoolantTemperature
    desired:
      value: '55.0'
      metadata:
        source: cloud
        reason: initial-configuration
    reportToCloud: true
    visitors:
      protocolName: virtual-ethernet
      configData:
        source: simulator
        signal: targetCoolantTemperature
    collectCycle: 20000
    reportCycle: 20000
  - name: pumpEnabled
    desired:
      value: 'true'
      metadata:
        source: cloud
        reason: initial-configuration
    reportToCloud: true
    visitors:
      protocolName: virtual-ethernet
      configData:
        source: simulator
        signal: pumpEnabled
    collectCycle: 30000
    reportCycle: 30000
  - name: targetPumpSpeed
    desired:
      value: '1800'
      metadata:
        source: cloud
        reason: initial-configuration
    reportToCloud: true
    visitors:
      protocolName: virtual-ethernet
      configData:
        source: simulator
        signal: targetPumpSpeed
    collectCycle: 30000
    reportCycle: 30000
  - name: coolingFanEnabled
    desired:
      value: 'true'
      metadata:
        source: cloud
        reason: initial-configuration
    reportToCloud: true
    visitors:
      protocolName: virtual-ethernet
      configData:
        source: simulator
        signal: coolingFanEnabled
    collectCycle: 30000
    reportCycle: 30000
  - name: targetFanDutyCycle
    desired:
      value: '35'
      metadata:
        source: cloud
        reason: initial-configuration
    reportToCloud: true
    visitors:
      protocolName: virtual-ethernet
      configData:
        source: simulator
        signal: targetFanDutyCycle
    collectCycle: 30000
    reportCycle: 30000
  methods:
  - name: configureCooling
    description: Configure cooling mode, coolant target and pump/fan targets
    propertyNames:
    - operatingMode
    - targetCoolantTemperature
    - targetPumpSpeed
    - targetFanDutyCycle
  - name: configureSampling
    description: Change telemetry sampling interval
    propertyNames:
    - samplingInterval
