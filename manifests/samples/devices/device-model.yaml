
apiVersion: devices.kubeedge.io/v1beta1
kind: DeviceModel
metadata:
  name: environmental-controller
  namespace: default
  labels:
    app: up2date4sdv-demo
    domain: industrial-iot
    version: v1
  annotations:
    description: "Virtual environmental monitoring and control device"
    manufacturer: "Demo"
    category: "Environmental controller"
spec:
  protocol: virtual
  protocolConfigData:
    simulator: true
    transport: internal

  properties:
    - name: temperature
      description: "Ambient temperature"
      type: DOUBLE
      accessMode: ReadOnly
      minimum: "-40"
      maximum: "125"
      unit: "Celsius"

    - name: humidity
      description: "Relative humidity"
      type: FLOAT
      accessMode: ReadOnly
      minimum: "0"
      maximum: "100"
      unit: "%"

    - name: pressure
      description: "Atmospheric pressure"
      type: DOUBLE
      accessMode: ReadOnly
      minimum: "300"
      maximum: "1200"
      unit: "hPa"

    - name: lightLevel
      description: "Ambient illuminance"
      type: INT
      accessMode: ReadOnly
      minimum: "0"
      maximum: "100000"
      unit: "lux"

    - name: batteryLevel
      description: "Battery state of charge"
      type: INT
      accessMode: ReadOnly
      minimum: "0"
      maximum: "100"
      unit: "%"

    - name: voltage
      description: "Supply voltage"
      type: FLOAT
      accessMode: ReadOnly
      minimum: "0"
      maximum: "5"
      unit: "V"

    - name: online
      description: "Device connectivity state"
      type: BOOLEAN
      accessMode: ReadOnly

    - name: firmwareVersion
      description: "Installed firmware version"
      type: STRING
      accessMode: ReadOnly

    - name: serialNumber
      description: "Hardware serial number"
      type: STRING
      accessMode: ReadOnly

    - name: operatingMode
      description: "AUTO, MANUAL or ECO mode"
      type: STRING
      accessMode: ReadWrite

    - name: samplingInterval
      description: "Sensor sampling interval"
      type: INT
      accessMode: ReadWrite
      minimum: "1"
      maximum: "3600"
      unit: "s"

    - name: temperatureSetpoint
      description: "Target temperature"
      type: DOUBLE
      accessMode: ReadWrite
      minimum: "10"
      maximum: "40"
      unit: "Celsius"

    - name: fanEnabled
      description: "Fan actuator enabled"
      type: BOOLEAN
      accessMode: ReadWrite

    - name: alarmEnabled
      description: "Alarm monitoring enabled"
      type: BOOLEAN
      accessMode: ReadWrite
