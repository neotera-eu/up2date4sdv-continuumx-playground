apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-edge
spec:
  selector:
    matchLabels:
      app: nginx-edge
  template:
    metadata:
      labels:
        app: nginx-edge
    spec:
      nodeName: u2deb-edge
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - name: http
          containerPort: 80
          hostPort: 80
      tolerations:
      - key: node-role.kubernetes.io/edge
        operator: Exists
        effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-edge
spec:
  type: NodePort
  selector:
    app: nginx-edge
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30080

